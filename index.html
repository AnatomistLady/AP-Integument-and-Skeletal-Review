<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A&P 1 Unit 2 Mastery Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 60px;
    }
    .wrapper {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      background: #1e293b;
      border: 1px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 10px;
      padding: 16px;
    }
    h1 {
      font-size: 1.25rem;
      color: #f8fafc;
      font-weight: 700;
    }
    .subtitle {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .banner {
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
    }
    .banner.locked {
      background: #1e1e38;
      border-color: #4338ca;
      color: #c7d2fe;
    }
    .banner.unlocked {
      background: #064e3b;
      border-color: #10b981;
      color: #ecfdf5;
    }
    .dashboard {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
      text-align: center;
    }
    .stat-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 4px;
    }
    .stat-label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      display: block;
    }
    .stat-val {
      font-size: 1.05rem;
      color: #38bdf8;
      font-weight: 800;
      margin-top: 2px;
    }
    .bar-bg {
      background: #334155;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      width: 0%;
      transition: width 0.3s;
    }
    .round-status {
      background: #032b43;
      border: 1px solid #0284c7;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #e0f2fe;
      display: flex;
      justify-content: space-between;
    }
    .quiz-feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .q-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
    }
    .q-title {
      background: #0f172a;
      border-bottom: 1px solid #334155;
      padding: 10px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
    .q-main {
      padding: 16px;
    }
    .q-text {
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.45;
      color: #f8fafc;
      margin-bottom: 14px;
    }
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 0.9rem;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.1s;
    }
    .opt-item:hover:not(.disabled) {
      background: #1e293b;
      border-color: #38bdf8;
    }
    .opt-dot {
      width: 16px;
      height: 16px;
      min-width: 16px;
      border: 2px solid #64748b;
      border-radius: 50%;
    }
    .opt-item.picked-right {
      background: #064e3b !important;
      border-color: #10b981 !important;
      color: #ecfdf5 !important;
    }
    .opt-item.picked-right .opt-dot {
      background: #10b981;
      border-color: #10b981;
    }
    .opt-item.picked-wrong {
      background: #7f1d1d !important;
      border-color: #ef4444 !important;
      color: #fef2f2 !important;
    }
    .opt-item.picked-wrong .opt-dot {
      background: #ef4444;
      border-color: #ef4444;
    }
    .opt-item.disabled {
      cursor: default;
    }
    .expl-banner {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
    }
    .expl-banner.show-right {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #a7f3d0;
    }
    .expl-banner.show-wrong {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .btn-new-round {
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-new-round:hover {
      background: #0369a1;
    }
    .btn-clear-mem {
      background: transparent;
      border: 1px solid #334155;
      color: #64748b;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-clear-mem:hover {
      color: #ef4444;
      border-color: #ef4444;
    }
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <div class="wrapper">
    <header>
      <h1>A&P 1 Unit 2 Mastery Engine</h1>
      <div class="subtitle">OpenStax Anatomy & Physiology 2e • Chapters 5 & 6</div>
    </header>

    <div id="bannerBox" class="banner locked">
      <span id="bannerMsg">🔒 <strong>Stage 1: Integumentary System</strong> (Master 20/25 to unlock Bone Biology)</span>
      <span id="bannerCounter">0 / 20</span>
    </div>

    <div class="dashboard">
      <div class="stat-grid">
        <div class="stat-card">
          <span class="stat-label">Mastery</span>
          <span id="dashMastery" class="stat-val">0%</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Mastered</span>
          <span id="dashTotal" class="stat-val">0 / 50</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Skin</span>
          <span id="dashSkin" class="stat-val">0 / 25</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Bone</span>
          <span id="dashBone" class="stat-val">🔒 Locked</span>
        </div>
      </div>
      <div class="bar-bg">
        <div id="dashBar" class="bar-fill"></div>
      </div>
    </div>

    <div class="round-status">
      <span>Current Quiz: <span id="roundProgress">0 / 10</span></span>
      <span>Score: <span id="roundScore">0%</span></span>
    </div>

    <div id="quizFeed" class="quiz-feed"></div>

    <div class="control-row">
      <button class="btn-clear-mem" id="btnReset">Reset Progress</button>
      <button class="btn-new-round" id="btnNewRound">Generate New 10-Q Quiz ↻</button>
    </div>
  </div>

  <script>
    /* QUESTION DATABASE: 25 INTEGUMENTARY (IDs 1-25), 25 SKELETAL (IDs 26-50) */
    const BANK = [
      { id: 1, chapter: 5, category: "Ch 5: Epidermis", prompt: "Which stratum of the epidermis consists of a single layer of cuboidal mitotically active stem cells that continuously generate new keratinocytes?", options: ["Stratum basale", "Stratum spinosum", "Stratum granulosum", "Stratum corneum"], answer: "Stratum basale", expl: "The stratum basale (germinativum) is the deepest layer attached to the basement membrane containing dividing stem cells." },
      { id: 2, chapter: 5, category: "Ch 5: Epidermis", prompt: "Which epidermal layer is found exclusively in thick skin (palms and soles)?", options: ["Stratum lucidum", "Stratum spinosum", "Stratum granulosum", "Stratum corneum"], answer: "Stratum lucidum", expl: "The stratum lucidum is a smooth, translucent layer of dead cells present only in thick skin." },
      { id: 3, chapter: 5, category: "Ch 5: Epidermal Cells", prompt: "Which dendritic cells reside in the stratum spinosum and function as antigen-presenting macrophages?", options: ["Langerhans cells", "Merkel cells", "Melanocytes", "Fibroblasts"], answer: "Langerhans cells", expl: "Langerhans cells are immune sentinels that phagocytize pathogens and activate defensive immune responses." },
      { id: 4, chapter: 5, category: "Ch 5: Pigmentation", prompt: "The primary pigment synthesized in basal cells to shield nuclear DNA from UV radiation is:", options: ["Melanin", "Carotene", "Hemoglobin", "Keratohyalin"], answer: "Melanin", expl: "Melanin is transferred to keratinocytes to form a protective umbrella over nuclear DNA." },
      { id: 5, chapter: 5, category: "Ch 5: Sensation", prompt: "Which sensory receptor cells in the stratum basale detect light touch and texture?", options: ["Merkel cells", "Pacinian corpuscles", "Meissner corpuscles", "Ruffini endings"], answer: "Merkel cells", expl: "Merkel cells connect with sensory nerve endings in the epidermis to perceive light touch." },
      { id: 6, chapter: 5, category: "Ch 5: Dermis", prompt: "The superficial 20% of the dermis made of loose areolar connective tissue with dermal papillae is the:", options: ["Papillary layer", "Reticular layer", "Hypodermis", "Stratum basale"], answer: "Papillary layer", expl: "The papillary layer contains loose areolar connective tissue, capillary loops, and defensive cells." },
      { id: 7, chapter: 5, category: "Ch 5: Dermis", prompt: "The deep 80% of the dermis composed of dense irregular connective tissue with prominent collagen bundles is the:", options: ["Reticular layer", "Papillary layer", "Subcutaneous layer", "Epidermal stratum corneum"], answer: "Reticular layer", expl: "The reticular dermis contains thick dense irregular collagen networks providing high tensile strength." },
      { id: 8, chapter: 5, category: "Ch 5: Hypodermis", prompt: "The subcutaneous layer underlying the dermis that stores adipose tissue and anchors skin to fascia is the:", options: ["Hypodermis", "Reticular dermis", "Stratum basale", "Papillary layer"], answer: "Hypodermis", expl: "The hypodermis (superficial fascia) insulates the body and anchors the skin to underlying muscle." },
      { id: 9, chapter: 5, category: "Ch 5: Cutaneous Glands", prompt: "Exocrine glands that release an oily secretion (sebum) via holocrine secretion into hair follicles are:", options: ["Sebaceous glands", "Eccrine sweat glands", "Apocrine sweat glands", "Ceruminous glands"], answer: "Sebaceous glands", expl: "Sebaceous glands rupture entire cells to lubricate hair and skin with lipid-rich sebum." },
      { id: 10, chapter: 5, category: "Ch 5: Cutaneous Glands", prompt: "Coiled tubular glands distributed across the body that produce watery perspiration for thermoregulation are:", options: ["Eccrine sweat glands", "Apocrine sweat glands", "Sebaceous glands", "Ceruminous glands"], answer: "Eccrine sweat glands", expl: "Eccrine sweat glands secrete a watery electrolyte solution directly onto the skin surface to cool the body." },
      { id: 11, chapter: 5, category: "Ch 5: Cutaneous Glands", prompt: "Which large sweat glands become active at puberty in the axillary and groin areas, causing body odor upon bacterial breakdown?", options: ["Apocrine sweat glands", "Eccrine sweat glands", "Holocrine glands", "Mammary glands"], answer: "Apocrine sweat glands", expl: "Apocrine glands empty viscous organic secretions into hair follicles that produce odor when bacteria feed on them." },
      { id: 12, chapter: 5, category: "Ch 5: Sensation", prompt: "Large, encapsulated sensory receptors deep in the dermis and hypodermis that detect deep pressure and vibration are:", options: ["Pacinian corpuscles", "Meissner corpuscles", "Merkel discs", "Free nerve endings"], answer: "Pacinian corpuscles", expl: "Pacinian (lamellar) corpuscles are onion-like mechanoreceptors tuned to deep pressure and vibration." },
      { id: 13, chapter: 5, category: "Ch 5: Hair Anatomy", prompt: "The bundle of smooth muscle attached to a hair follicle that causes goosebumps upon contraction is the:", options: ["Arrector pili", "Bulbous rectus", "Orbicularis cutis", "Follicular sphincter"], answer: "Arrector pili", expl: "The arrector pili contracts under sympathetic stimulation to pull hair shafts perpendicular to skin." },
      { id: 14, chapter: 5, category: "Ch 5: Metabolic Functions", prompt: "Keratinocytes use solar UV radiation to convert a cholesterol derivative into cholecalciferol, the precursor to:", options: ["Vitamin D", "Melatonin", "Keratin", "Vitamin A"], answer: "Vitamin D", expl: "Cholecalciferol is synthesized in the skin and modified by the liver and kidneys into active Vitamin D." },
      { id: 15, chapter: 5, category: "Ch 5: Keratinization", prompt: "In which epidermal layer do cells begin dying, accumulate keratohyalin, and release water-proofing glycolipids?", options: ["Stratum granulosum", "Stratum basale", "Stratum spinosum", "Stratum lucidum"], answer: "Stratum granulosum", expl: "In the stratum granulosum, keratinocytes disintegrate their nuclei and produce water-resistant glycolipid seals." },
      { id: 16, chapter: 5, category: "Ch 5: Clinical Burns", prompt: "A burn injury damaging the entire epidermis and upper dermis, marked by localized pain, erythema, and blisters, is a:", options: ["Second-degree burn", "First-degree burn", "Third-degree burn", "Fourth-degree burn"], answer: "Second-degree burn", expl: "Second-degree burns penetrate into the dermis, causing fluid blisters between the epidermis and dermis." },
      { id: 17, chapter: 5, category: "Ch 5: Oncology", prompt: "The most dangerous form of skin cancer, originating from pigment-producing cells and tracked by ABCDE rules, is:", options: ["Melanoma", "Basal cell carcinoma", "Squamous cell carcinoma", "Kaposi sarcoma"], answer: "Melanoma", expl: "Melanoma arises from melanocytes and has high potential for metastasis." },
      { id: 18, chapter: 5, category: "Ch 5: Dermis", prompt: "Predominant directional orientations of collagen bundles in the reticular dermis followed by surgeons are:", options: ["Cleavage lines", "Friction ridges", "Flexure lines", "Dermal papillae"], answer: "Cleavage lines", expl: "Cleavage (Langer) lines represent dermal collagen alignment; incisions parallel to them heal with less scarring." },
      { id: 19, chapter: 5, category: "Ch 5: Nails", prompt: "The actively growing proximal thickened portion of the nail bed responsible for nail growth is the:", options: ["Nail matrix", "Hyponychium", "Eponychium", "Lunula"], answer: "Nail matrix", expl: "The nail matrix contains dividing epithelial cells that produce the keratinized nail plate." },
      { id: 20, chapter: 5, category: "Ch 5: Nails", prompt: "The fold of stratum corneum projecting onto the proximal edge of the nail body (the cuticle) is the:", options: ["Eponychium", "Hyponychium", "Perionychium", "Lunula"], answer: "Eponychium", expl: "The eponychium (cuticle) seals the junction between the digit skin and the emerging nail body." },
      { id: 21, chapter: 5, category: "Ch 5: Thermoregulation", prompt: "When body temperature rises, dermal blood vessels respond by ________ to release heat to the environment.", options: ["Dilating (vasodilation)", "Constricting (vasoconstriction)", "Clotting", "Collapsing"], answer: "Dilating (vasodilation)", expl: "Dermal arterioles dilate to send warm blood closer to the skin surface for radiant heat loss." },
      { id: 22, chapter: 5, category: "Ch 5: Epidermis", prompt: "Which cell junctions tightly connect adjacent keratinocytes in the stratum spinosum, causing a spiny histological look?", options: ["Desmosomes", "Gap junctions", "Tight junctions", "Hemidesmosomes"], answer: "Desmosomes", expl: "Desmosomes are anchoring junctions that bridge neighboring intermediate filaments together." },
      { id: 23, chapter: 5, category: "Ch 5: Glands", prompt: "Modified apocrine sweat glands in the external ear canal that secrete earwax are:", options: ["Ceruminous glands", "Mammary glands", "Sebaceous glands", "Eccrine glands"], answer: "Ceruminous glands", expl: "Ceruminous glands secrete earwax (cerumen) to trap dirt and insects entering the ear canal." },
      { id: 24, chapter: 5, category: "Ch 5: Epidermis", prompt: "The outermost layer of 20 to 30 layers of dead, flattened keratinized cells that continuously slough off is the:", options: ["Stratum corneum", "Stratum granulosum", "Stratum spinosum", "Stratum lucidum"], answer: "Stratum corneum", expl: "The stratum corneum is the durable, keratin-filled protective outer barrier of the skin." },
      { id: 25, chapter: 5, category: "Ch 5: Clinical Pathology", prompt: "An autoimmune disease where rapid epidermal proliferation causes thick, silvery scaly plaques on red skin is:", options: ["Psoriasis", "Eczema", "Basal cell carcinoma", "Alopecia"], answer: "Psoriasis", expl: "Psoriasis results from hyperactive immune signaling driving keratinocytes to divide too quickly." },

      { id: 26, chapter: 6, category: "Ch 6: Bone Cells", prompt: "Large multinucleated cells derived from white blood cell lines that secrete acid to dissolve bone matrix are:", options: ["Osteoclasts", "Osteoblasts", "Osteocytes", "Osteogenic cells"], answer: "Osteoclasts", expl: "Osteoclasts resorb mineralized bone tissue by releasing hydrochloric acid and lysosomal enzymes." },
      { id: 27, chapter: 6, category: "Ch 6: Bone Cells", prompt: "Bone-building cells that synthesize and secrete organic bone matrix (osteoid) are:", options: ["Osteoblasts", "Osteoclasts", "Osteocytes", "Chondrocytes"], answer: "Osteoblasts", expl: "Osteoblasts deposit collagen and proteoglycans (osteoid) and initiate calcification." },
      { id: 28, chapter: 6, category: "Ch 6: Bone Cells", prompt: "Mature bone cells entrapped inside lacunae that maintain matrix and sense mechanical stress are:", options: ["Osteocytes", "Osteoclasts", "Osteoprogenitor cells", "Fibroblasts"], answer: "Osteocytes", expl: "Osteocytes monitor physical strain and communicate through canaliculi to direct remodeling." },
      { id: 29, chapter: 6, category: "Ch 6: Bone Cells", prompt: "Mesenchymal stem cells located in the periosteum and endosteum that divide to create osteoblasts are:", options: ["Osteogenic cells", "Osteocytes", "Osteoclasts", "Chondroblasts"], answer: "Osteogenic cells", expl: "Osteogenic (osteoprogenitor) cells are the only bone cells that undergo cellular mitosis." },
      { id: 30, chapter: 6, category: "Ch 6: Histology", prompt: "The basic microscopic cylindrical structural unit of compact bone is the:", options: ["Osteon", "Trabecula", "Canaliculus", "Lacuna"], answer: "Osteon", expl: "An osteon (Haversian system) is the cylindrical unit composed of concentric lamellae around a central canal." },
      { id: 31, chapter: 6, category: "Ch 6: Histology", prompt: "The longitudinal canal located in the center of an osteon containing blood vessels and nerves is the:", options: ["Central canal", "Perforating canal", "Canaliculus", "Medullary cavity"], answer: "Central canal", expl: "The central (Haversian) canal carries blood vessels and nerve fibers through the core of the osteon." },
      { id: 32, chapter: 6, category: "Ch 6: Histology", prompt: "Canals that run perpendicular to the bone axis connecting periosteal vessels to central canals are:", options: ["Perforating canals", "Haversian canals", "Canaliculi", "Medullary clefts"], answer: "Perforating canals", expl: "Perforating (Volkmann) canals route blood vessels from outside the bone into central canals." },
      { id: 33, chapter: 6, category: "Ch 6: Histology", prompt: "Tiny micro-canals radiating between lacunae that allow osteocytes to share nutrients via gap junctions are:", options: ["Canaliculi", "Lamellae", "Central canals", "Sinusoids"], answer: "Canaliculi", expl: "Canaliculi contain the cytoplasmic extensions of osteocytes to pass ions and nutrients." },
      { id: 34, chapter: 6, category: "Ch 6: Histology", prompt: "The lattice-like network of microscopic bony plates and struts found in spongy bone is called:", options: ["Trabeculae", "Osteons", "Concentric lamellae", "Perforating fibers"], answer: "Trabeculae", expl: "Spongy bone lacks complete osteons; its matrix organizes into stress-aligned struts called trabeculae." },
      { id: 35, chapter: 6, category: "Ch 6: Anatomy", prompt: "The tubular shaft of a typical long bone containing the yellow marrow cavity is the:", options: ["Diaphysis", "Epiphysis", "Metaphysis", "Apophysis"], answer: "Diaphysis", expl: "The diaphysis is the long central cylinder of compact bone enclosing the medullary cavity." },
      { id: 36, chapter: 6, category: "Ch 6: Anatomy", prompt: "The expanded bulbous ends of a long bone filled with spongy bone and red marrow are the:", options: ["Epiphyses", "Diaphyses", "Metaphyses", "Endostea"], answer: "Epiphyses", expl: "The epiphyses are the knobby proximal and distal joint-forming ends of long bones." },
      { id: 37, chapter: 6, category: "Ch 6: Membranes", prompt: "The tough fibrous connective tissue membrane covering all outer bone surfaces except articular joints is the:", options: ["Periosteum", "Endosteum", "Perichondrium", "Synovium"], answer: "Periosteum", expl: "The periosteum contains an outer fibrous protective layer and an inner osteogenic layer." },
      { id: 38, chapter: 6, category: "Ch 6: Membranes", prompt: "The delicate vascular membrane lining the internal marrow cavities, trabeculae, and central canals is the:", options: ["Endosteum", "Periosteum", "Perichondrium", "Sharpey matrix"], answer: "Endosteum", expl: "The endosteum is an active osteogenic layer lining the inside surfaces of bone." },
      { id: 39, chapter: 6, category: "Ch 6: Membranes", prompt: "Collagen fibers that firmly anchor the periosteum into the outer circumferential lamellae are:", options: ["Perforating (Sharpey) fibers", "Trabeculae", "Tendons", "Canaliculi"], answer: "Perforating (Sharpey) fibers", expl: "Perforating (Sharpey) fibers lock the periosteum and attached tendons directly into the bone matrix." },
      { id: 40, chapter: 6, category: "Ch 6: Matrix", prompt: "The mineral salt crystal component of bone matrix providing compressive hardness is:", options: ["Hydroxyapatite", "Osteoid collagen", "Chondroitin sulfate", "Calcium carbonate"], answer: "Hydroxyapatite", expl: "Calcium phosphate crystals (hydroxyapatite) form the hard inorganic mineral component of bone." },
      { id: 41, chapter: 6, category: "Ch 6: Ossification", prompt: "The bone formation process where flat cranial bones form directly inside embryonic mesenchymal membranes is:", options: ["Intramembranous ossification", "Endochondral ossification", "Appositional growth", "Remodeling"], answer: "Intramembranous ossification", expl: "Intramembranous ossification builds bone directly within mesenchymal sheets without a cartilage model." },
      { id: 42, chapter: 6, category: "Ch 6: Ossification", prompt: "During endochondral bone formation, the primary ossification center first appears in the:", options: ["Center of diaphysis", "Proximal epiphysis", "Distal epiphysis", "Articular cartilage"], answer: "Center of diaphysis", expl: "Blood vessels penetrate the perichondrium at the mid-shaft to initiate the primary ossification center." },
      { id: 43, chapter: 6, category: "Ch 6: Growth", prompt: "The hyaline cartilage plate located in the metaphysis that allows growing bones to lengthen is the:", options: ["Epiphyseal plate", "Articular cartilage", "Trabecular zone", "Epiphyseal line"], answer: "Epiphyseal plate", expl: "Chondrocytes divide and push the epiphysis away from the diaphysis, lengthening the bone." },
      { id: 44, chapter: 6, category: "Ch 6: Growth", prompt: "The process by which bones increase in width and thickness beneath the periosteum is called:", options: ["Appositional growth", "Endochondral elongation", "Interstitial growth", "Fibrosis"], answer: "Appositional growth", expl: "Osteoblasts under the periosteum lay down new matrix while osteoclasts widen the marrow cavity." },
      { id: 45, chapter: 6, category: "Ch 6: Homeostasis", prompt: "Which hormone is released by the parathyroid glands during hypocalcemia to stimulate osteoclast activity?", options: ["Parathyroid hormone (PTH)", "Calcitonin", "Thyroxine", "Growth hormone"], answer: "Parathyroid hormone (PTH)", expl: "PTH triggers osteoclasts to dissolve bone and release calcium into the bloodstream." },
      { id: 46, chapter: 6, category: "Ch 6: Homeostasis", prompt: "Which thyroid hormone inhibits osteoclasts and encourages bone deposition during high blood calcium levels?", options: ["Calcitonin", "Parathyroid hormone", "Calcitriol", "Estrogen"], answer: "Calcitonin", expl: "Calcitonin lowers elevated blood calcium levels by dampening osteoclast activity." },
      { id: 47, chapter: 6, category: "Ch 6: Physiology", prompt: "The principle stating that bones adapt and grow stronger along lines of mechanical stress is:", options: ["Wolff's law", "Starling's law", "The Octet rule", "Laplace's rule"], answer: "Wolff's law", expl: "Wolff's law explains how physical stress and mechanical forces thicken bone cortex along tension lines." },
      { id: 48, chapter: 6, category: "Ch 6: Fracture Repair", prompt: "What is the correct sequential order of bone fracture repair?", options: [
        "Hematoma -> Soft callus -> Bony callus -> Remodeling",
        "Soft callus -> Hematoma -> Bony callus -> Remodeling",
        "Bony callus -> Hematoma -> Soft callus -> Remodeling",
        "Hematoma -> Bony callus -> Soft callus -> Remodeling"
      ], answer: "Hematoma -> Soft callus -> Bony callus -> Remodeling", expl: "Fracture repair progresses from a hematoma to a fibrocartilaginous callus, hard bony callus, and remodeling." },
      { id: 49, chapter: 6, category: "Ch 6: Pathology", prompt: "A condition where bone resorption outpaces deposition, making bones fragile and porous, is:", options: ["Osteoporosis", "Osteomalacia", "Osteogenesis imperfecta", "Paget's disease"], answer: "Osteoporosis", expl: "Osteoporosis involves substantial loss of bone mineral density, elevating fracture risk." },
      { id: 50, chapter: 6, category: "Ch 6: Classification", prompt: "The patella is classified as which specific bone type that develops inside a tendon to reduce friction?", options: ["Sesamoid bone", "Pneumatic bone", "Flat bone", "Irregular bone"], answer: "Sesamoid bone", expl: "Sesamoid bones form inside tendons near joints to optimize mechanical pull and minimize tendon wear." }
    ];

    /* SAFE PROGRESSION TRACKING (localStorage with fallback) */
    const STORAGE_TAG = "ap1_u2_clean_mastery";
    let memoryMastered = [];

    function readMastered() {
      try {
        const d = localStorage.getItem(STORAGE_TAG);
        if (d) {
          const arr = JSON.parse(d);
          if (Array.isArray(arr)) return arr;
        }
      } catch (err) {}
      return memoryMastered;
    }

    function recordMastered(qid) {
      let list = readMastered();
      const hadUnlocked = checkUnlocked(list);
      if (!list.includes(qid)) {
        list.push(qid);
        memoryMastered = list;
        try {
          localStorage.setItem(STORAGE_TAG, JSON.stringify(list));
        } catch (err) {}
      }
      const nowUnlocked = checkUnlocked(list);
      if (!hadUnlocked && nowUnlocked) {
        shootConfetti();
        alert("🎉 Congratulations! You have mastered 20 Integumentary questions! The Skeletal System (Bone Biology) is now unlocked!");
      }
      refreshStats();
    }

    function checkUnlocked(list) {
      const skinCount = list.filter(id => id <= 25).length;
      return skinCount >= 20;
    }

    function refreshStats() {
      const list = readMastered();
      const totalCount = BANK.length;
      const masteredCount = list.length;
      const skinCount = list.filter(id => id <= 25).length;
      const boneCount = list.filter(id => id > 25).length;
      const isUnlocked = checkUnlocked(list);

      const pct = Math.round((masteredCount / totalCount) * 100);
      document.getElementById("dashMastery").textContent = pct + "%";
      document.getElementById("dashTotal").textContent = masteredCount + " / " + totalCount;
      document.getElementById("dashSkin").textContent = skinCount + " / 25";
      document.getElementById("dashBar").style.width = pct + "%";

      const bBox = document.getElementById("bannerBox");
      const bMsg = document.getElementById("bannerMsg");
      const bCtr = document.getElementById("bannerCounter");
      const bStat = document.getElementById("dashBone");

      if (!isUnlocked) {
        bBox.className = "banner locked";
        bMsg.innerHTML = "🔒 <strong>Stage 1: Integumentary System</strong> (Master 20/25 to unlock Bone Biology)";
        bCtr.textContent = skinCount + " / 20";
        bStat.textContent = "🔒 Locked";
        bStat.style.color = "#94a3b8";
      } else {
        bBox.className = "banner unlocked";
        bMsg.innerHTML = "🔓 <strong>Stage 2: Comprehensive Mode</strong> (Integumentary & Skeletal Systems Active)";
        bCtr.textContent = "UNLOCKED";
        bStat.textContent = boneCount + " / 25";
        bStat.style.color = "#38bdf8";
      }
    }

    /* ROUND LOGIC (GENERATES 10 BALANCED QUESTIONS) */
    let currentRoundQuestions = [];
    let roundAnswers = {};
    let roundCorrect = 0;

    function pickQuestions() {
      const list = readMastered();
      const unlocked = checkUnlocked(list);
      let selected = [];

      if (!unlocked) {
        // Only Chapter 5 (Skin: IDs 1-25)
        let skinPool = BANK.filter(q => q.chapter === 5);
        let unmastered = skinPool.filter(q => !list.includes(q.id)).sort(() => Math.random() - 0.5);
        let mastered = skinPool.filter(q => list.includes(q.id)).sort(() => Math.random() - 0.5);
        selected = unmastered.concat(mastered).slice(0, 10);
      } else {
        // 5 from Skin, 5 from Bone
        [5, 6].forEach(ch => {
          let pool = BANK.filter(q => q.chapter === ch);
          let unmastered = pool.filter(q => !list.includes(q.id)).sort(() => Math.random() - 0.5);
          let mastered = pool.filter(q => list.includes(q.id)).sort(() => Math.random() - 0.5);
          selected = selected.concat(unmastered.concat(mastered).slice(0, 5));
        });
      }

      return selected.sort(() => Math.random() - 0.5);
    }

    function buildQuizDOM() {
      currentRoundQuestions = pickQuestions();
      roundAnswers = {};
      roundCorrect = 0;
      updateRoundStats();
      refreshStats();

      const feed = document.getElementById("quizFeed");
      feed.innerHTML = "";

      currentRoundQuestions.forEach((q, index) => {
        const card = document.createElement("div");
        card.className = "q-box";

        const head = document.createElement("div");
        head.className = "q-title";
        head.innerHTML = "<span>Question " + (index + 1) + " • <strong style='color:#38bdf8;'>" + q.category + "</strong></span><span>1 pt</span>";
        card.appendChild(head);

        const body = document.createElement("div");
        body.className = "q-main";

        const text = document.createElement("div");
        text.className = "q-text";
        text.textContent = q.prompt;
        body.appendChild(text);

        const optsGroup = document.createElement("div");
        optsGroup.className = "options-group";

        const expl = document.createElement("div");
        expl.className = "expl-banner";
        expl.id = "expl_" + q.id;

        // Scramble options
        const shuffledOpts = [...q.options].sort(() => Math.random() - 0.5);

        shuffledOpts.forEach(optText => {
          const btn = document.createElement("div");
          btn.className = "opt-item";

          const dot = document.createElement("div");
          dot.className = "opt-dot";

          const label = document.createElement("span");
          label.textContent = optText;

          btn.appendChild(dot);
          btn.appendChild(label);

          btn.onclick = function() {
            if (roundAnswers[q.id] !== undefined) return;
            roundAnswers[q.id] = optText;

            const isRight = (optText === q.answer);

            // Lock row
            Array.from(optsGroup.children).forEach(child => {
              child.classList.add("disabled");
              const childText = child.querySelector("span").textContent;
              if (childText === q.answer) {
                child.classList.add("picked-right");
              } else if (childText === optText) {
                child.classList.add("picked-wrong");
              }
            });

            if (isRight) {
              roundCorrect++;
              recordMastered(q.id);
              expl.className = "expl-banner show-right";
              expl.innerHTML = "<strong>✓ Correct!</strong> " + q.expl;
              shootConfetti();
            } else {
              expl.className = "expl-banner show-wrong";
              expl.innerHTML = "<strong>✗ Incorrect.</strong> " + q.expl;
            }

            updateRoundStats();
          };

          optsGroup.appendChild(btn);
        });

        body.appendChild(optsGroup);
        body.appendChild(expl);
        card.appendChild(body);
        feed.appendChild(card);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateRoundStats() {
      const answered = Object.keys(roundAnswers).length;
      document.getElementById("roundProgress").textContent = answered + " / " + currentRoundQuestions.length;
      const scorePct = answered === 0 ? 0 : Math.round((roundCorrect / answered) * 100);
      document.getElementById("roundScore").textContent = scorePct + "%";
    }

    /* SCIENCE CONFETTI SYSTEM */
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let confettiParts = [];
    let confettiTimer = null;

    function fitCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", fitCanvas);
    fitCanvas();

    function shootConfetti() {
      const colors = ["#38bdf8", "#4ade80", "#facc15", "#fb923c", "#c084fc", "#22d3ee"];
      const shapes = ["atom", "dna", "ring", "spark"];

      for (let i = 0; i < 40; i++) {
        confettiParts.push({
          x: window.innerWidth / 2 + (Math.random() * 200 - 100),
          y: window.innerHeight * 0.35 + (Math.random() * 80 - 40),
          vx: (Math.random() - 0.5) * 12,
          vy: Math.random() * -10 - 4,
          size: Math.random() * 10 + 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          shape: shapes[Math.floor(Math.random() * shapes.length)],
          rot: Math.random() * 6.28,
          vrot: (Math.random() - 0.5) * 0.2,
          alpha: 1
        });
      }

      if (!confettiTimer) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = confettiParts.length - 1; i >= 0; i--) {
        const p = confettiParts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.rot += p.vrot;
        p.alpha -= 0.015;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.strokeStyle = p.color;
        ctx.fillStyle = p.color;
        ctx.lineWidth = 2;

        if (p.shape === "ring") {
          ctx.beginPath();
          for (let s = 0; s < 6; s++) {
            const a = (s * Math.PI) / 3;
            const hx = Math.cos(a) * (p.size / 2);
            const hy = Math.sin(a) * (p.size / 2);
            if (s === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          ctx.stroke();
        } else if (p.shape === "atom") {
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size / 2, p.size / 5, Math.PI / 4, 0, Math.PI * 2);
          ctx.ellipse(0, 0, p.size / 2, p.size / 5, -Math.PI / 4, 0, Math.PI * 2);
          ctx.stroke();
        } else if (p.shape === "dna") {
          ctx.beginPath();
          ctx.moveTo(-p.size / 2, -p.size / 3);
          ctx.lineTo(p.size / 2, -p.size / 3);
          ctx.moveTo(-p.size / 2, p.size / 3);
          ctx.lineTo(p.size / 2, p.size / 3);
          ctx.stroke();
        } else {
          ctx.fillRect(-p.size / 4, -p.size / 4, p.size / 2, p.size / 2);
        }

        ctx.restore();

        if (p.alpha <= 0 || p.y > canvas.height) {
          confettiParts.splice(i, 1);
        }
      }

      if (confettiParts.length > 0) {
        confettiTimer = requestAnimationFrame(animateConfetti);
      } else {
        confettiTimer = null;
      }
    }

    // Attach control buttons
    document.getElementById("btnNewRound").onclick = buildQuizDOM;
    document.getElementById("btnReset").onclick = function() {
      if (confirm("Reset all mastered question history for Unit 2?")) {
        memoryMastered = [];
        try { localStorage.removeItem(STORAGE_TAG); } catch (err) {}
        buildQuizDOM();
      }
    };

    // Run first round
    buildQuizDOM();
  </script>
</body>
