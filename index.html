<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A&P 1 Unit 2 Progressive Mastery Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 18px 12px 64px;
    }

    header {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border: 1px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }
    .subhead {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 5px;
    }

    /* TIER PROGRESSION BANNER */
    .tier-banner {
      width: 100%;
      max-width: 720px;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .tier-banner.locked {
      background: #1e1e38;
      border-color: #4338ca;
      color: #c7d2fe;
    }
    .tier-banner.unlocked {
      background: #064e3b;
      border-color: #10b981;
      color: #ecfdf5;
    }

    /* DASHBOARD */
    .dashboard-panel {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      text-align: center;
      margin-bottom: 12px;
    }
    .dash-box {
      display: flex;
      flex-direction: column;
      background: #0f172a;
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .dash-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .dash-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 3px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ATTEMPT PANEL */
    .attempt-panel {
      width: 100%;
      max-width: 720px;
      background: #032b43;
      border: 1px solid #0284c7;
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #e0f2fe;
    }

    /* QUIZ QUESTIONS */
    .quiz-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .q-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .q-header {
      background: #0f172a;
      border-bottom: 1px solid #334155;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .q-body {
      padding: 18px;
    }
    .q-prompt {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
      color: #f8fafc;
      margin-bottom: 16px;
    }

    /* OPTIONS */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-btn {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.92rem;
      line-height: 1.45;
      font-weight: 400;
      color: #e2e8f0;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .opt-btn:hover:not(.locked) {
      background: #1e293b;
      border-color: #38bdf8;
    }
    .radio-circle {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border: 2px solid #64748b;
      border-radius: 50%;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* EVALUATION STYLES */
    .opt-btn.correct-choice {
      background: #064e3b !important;
      border: 2px solid #10b981 !important;
      color: #ecfdf5 !important;
      font-weight: 600;
    }
    .opt-btn.correct-choice .radio-circle {
      border-color: #10b981;
      background: #10b981;
    }
    .opt-btn.wrong-choice {
      background: #7f1d1d !important;
      border: 2px solid #ef4444 !important;
      color: #fef2f2 !important;
      font-weight: 600;
    }
    .opt-btn.wrong-choice .radio-circle {
      border-color: #ef4444;
      background: #ef4444;
    }
    .opt-btn.locked {
      cursor: default;
    }

    .feedback-box {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    .feedback-box.correct {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #a7f3d0;
    }
    .feedback-box.incorrect {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    /* CONTROLS */
    .action-row {
      width: 100%;
      max-width: 720px;
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-new {
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }
    .btn-new:hover {
      background: #0369a1;
    }
    .btn-reset-data {
      background: transparent;
      color: #64748b;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-reset-data:hover {
      color: #ef4444;
      border-color: #ef4444;
    }

    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <header>
    <h1>A&P 1 Unit 2 Progressive Mastery Engine</h1>
    <div class="subhead">OpenStax Anatomy & Physiology 2e • Chapters 5 & 6 (Unlock Progression)</div>
  </header>

  <!-- PROGRESSION LOCK / UNLOCK BANNER -->
  <div id="tierBanner" class="tier-banner locked">
    <span id="tierStatusText">🔒 <strong>Stage 1: Integumentary System</strong> (Master 20/25 to unlock Bone Biology)</span>
    <span id="tierCounterText">0 / 20</span>
  </div>

  <!-- PERSISTENT MASTERY DASHBOARD -->
  <div class="dashboard-panel">
    <div class="dash-grid">
      <div class="dash-box">
        <span class="dash-label">Bank Mastery</span>
        <span id="masteryPct" class="dash-val">0%</span>
      </div>
      <div class="dash-box">
        <span class="dash-label">Mastered</span>
        <span id="masteredCount" class="dash-val">0 / 50</span>
      </div>
      <div class="dash-box">
        <span class="dash-label">Skin Mastered</span>
        <span id="skinMasteredCount" class="dash-val">0 / 25</span>

        <span class="dash-label">Bone Mastered</span>
        <span id="boneMasteredCount" class="dash-val">🔒 Locked</span>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div id="masteryBar" class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- CURRENT ATTEMPT STATS -->
  <div class="attempt-panel">
    <span>Current Quiz: <span id="attemptProgress">0 / 10</span></span>
    <span>Score: <span id="attemptScore">0%</span></span>
  </div>

  <div class="quiz-container" id="quizContainer"></div>

  <div class="action-row">
    <button class="btn-reset-data" onclick="clearSavedMastery()">Reset Mastered History</button>
    <button class="btn-new" onclick="startNewAttempt()">Generate New 10-Q Quiz ↻</button>
  </div>

  <script>
    const UNLOCK_THRESHOLD = 20; // Must master 20/25 skin questions to unlock bone

    /* 50-QUESTION TEST BANK (25 INTEGUMENTARY, 25 SKELETAL) */
    const QUESTION_BANK = [
      /* =========================================================
         CHAPTER 5: THE INTEGUMENTARY SYSTEM (1 - 25)
         ========================================================= */
      {
        id: 1, chapter: 5, chapName: "Ch 5: Epidermal Strata",
        prompt: "Which stratum of the epidermis consists of a single layer of cuboidal mitotically active stem cells that continuously generate new keratinocytes?",
        options: ["Stratum basale", "Stratum spinosum", "Stratum granulosum", "Stratum corneum"],
        correct: 0,
        explanation: "The stratum basale (stratum germinativum) is the deepest epidermal layer attached to the basement membrane, containing active stem cells that undergo mitosis."
      },
      {
        id: 2, chapter: 5, chapName: "Ch 5: Thick Skin",
        prompt: "Which epidermal layer is found exclusively in thick skin (palms of the hands and soles of the feet)?",
        options: ["Stratum lucidum", "Stratum spinosum", "Stratum granulosum", "Stratum corneum"],
        correct: 0,
        explanation: "The stratum lucidum is a clear, thin, translucent layer of flattened, dead keratinocytes located between the stratum granulosum and stratum corneum only in thick skin."
      },
      {
        id: 3, chapter: 5, chapName: "Ch 5: Epidermal Cells",
        prompt: "Which dendritic cells reside in the stratum spinosum and function as antigen-presenting macrophages to defend against cutaneous pathogens?",
        options: ["Langerhans cells (intraepidermal macrophages)", "Merkel cells", "Melanocytes", "Fibroblasts"],
        correct: 0,
        explanation: "Langerhans cells (epidermal dendritic cells) are specialized immune sentinels that ingest microbes and migrate to lymph nodes to activate immune responses."
      },
      {
        id: 4, chapter: 5, chapName: "Ch 5: Pigmentation",
        prompt: "The primary pigment synthesized in specialized basal cells that transfers melanosomes to keratinocytes to shield nuclear DNA from ultraviolet (UV) radiation is:",
        options: ["Melanin", "Carotene", "Hemoglobin", "Keratohyalin"],
        correct: 0,
        explanation: "Melanin is synthesized by melanocytes in the stratum basale and packaged into melanosomes, which form protective umbrellas over the nuclei of keratinocytes."
      },
      {
        id: 5, chapter: 5, chapName: "Ch 5: Cutaneous Sensation",
        prompt: "Which sensory receptor cells in the stratum basale are coupled with sensory nerve endings to detect light touch and texture?",
        options: ["Merkel cells (tactile cells)", "Pacinian corpuscles", "Meissner corpuscles", "Ruffini endings"],
        correct: 0,
        explanation: "Merkel (tactile) cells are located in the deepest epidermal layer and associate with sensory nerve endings (tactile discs) to sense light touch."
      },
      {
        id: 6, chapter: 5, chapName: "Ch 5: Dermal Layers",
        prompt: "The superficial 20% of the dermis composed of loose areolar connective tissue with dermal papillae projecting into the epidermis is the:",
        options: ["Papillary layer", "Reticular layer", "Hypodermis", "Stratum basale"],
        correct: 0,
        explanation: "The papillary layer of the dermis consists of areolar connective tissue containing capillary loops, tactile receptors, and dermal papillae that form friction ridges."
      },
      {
        id: 7, chapter: 5, chapName: "Ch 5: Dermal Layers",
        prompt: "The deep, thicker layer of the dermis composed of dense irregular connective tissue with prominent interlocking bundles of collagen and elastic fibers is the:",
        options: ["Reticular layer", "Papillary layer", "Subcutaneous layer", "Epidermal stratum corneum"],
        correct: 0,
        explanation: "The reticular layer comprises ~80% of dermal thickness and consists of dense irregular connective tissue providing multidirectional tensile strength and elasticity."
      },
      {
        id: 8, chapter: 5, chapName: "Ch 5: Subcutaneous Layer",
        prompt: "The subcutaneous layer underlying the dermis that anchors skin to fascia and serves as a major site for adipose energy storage is the:",
        options: ["Hypodermis (superficial fascia)", "Reticular dermis", "Stratum basale", "Papillary layer"],
        correct: 0,
        explanation: "The hypodermis (subcutaneous layer) is not technically part of the skin; it consists of areolar and adipose connective tissue that insulates and cushions underlying muscle and bone."
      },
      {
        id: 9, chapter: 5, chapName: "Ch 5: Sebaceous Glands",
        prompt: "Exocrine glands that release an oily, lipid-rich secretion (sebum) via holocrine secretion into hair follicles to lubricate skin and inhibit bacterial growth are:",
        options: ["Sebaceous glands", "Eccrine sweat glands", "Apocrine sweat glands", "Ceruminous glands"],
        correct: 0,
        explanation: "Sebaceous glands secrete sebum through holocrine lysis of secretory cells, keeping hair flexible, water-resistant, and chemically protected against bacterial proliferation."
      },
      {
        id: 10, chapter: 5, chapName: "Ch 5: Sudoriferous Glands",
        prompt: "Coiled tubular sweat glands distributed abundantly across the palms, soles, and forehead that produce watery perspiration for thermoregulation are:",
        options: ["Eccrine (merocrine) sweat glands", "Apocrine sweat glands", "Sebaceous glands", "Ceruminous glands"],
        correct: 0,
        explanation: "Eccrine sweat glands discharge a hypotonic watery filtrate directly onto the skin surface via merocrine exocytosis to dissipate excess body heat through evaporative cooling."
      },
      {
        id: 11, chapter: 5, chapName: "Ch 5: Sudoriferous Glands",
        prompt: "Which large sweat glands become active at puberty in the axillary and anogenital regions, secreting a viscous organic sweat that causes body odor upon bacterial breakdown?",
        options: ["Apocrine sweat glands", "Eccrine sweat glands", "Holocrine glands", "Mammary glands"],
        correct: 0,
        explanation: "Apocrine sweat glands empty into hair follicles in the axillary and groin areas, releasing a protein- and lipid-rich sweat that produces body odor when metabolized by surface bacteria."
      },
      {
        id: 12, chapter: 5, chapName: "Ch 5: Cutaneous Sensation",
        prompt: "Large, encapsulated sensory mechanoreceptors located deep in the dermis and hypodermis specialized for detecting deep pressure and high-frequency vibration are:",
        options: ["Pacinian (lamellar) corpuscles", "Meissner corpuscles", "Merkel discs", "Free nerve endings"],
        correct: 0,
        explanation: "Pacinian (lamellar) corpuscles are onion-like layered mechanoreceptors situated deep in the dermis/hypodermis that respond rapidly to deep pressure and vibration."
      },
      {
        id: 13, chapter: 5, chapName: "Ch 5: Hair Anatomy",
        prompt: "The bundle of smooth muscle cells connecting the connective tissue root sheath of a hair follicle to the papillary dermis that causes 'goosebumps' upon contraction is the:",
        options: ["Arrector pili muscle", "Bulbous rectus", "Orbicularis cutis", "Follicular sphincter"],
        correct: 0,
        explanation: "The arrector pili is an involuntary smooth muscle band stimulated by the sympathetic nervous system during cold or emotional stress, pulling the follicle upright."
      },
      {
        id: 14, chapter: 5, chapName: "Ch 5: Vitamin D Synthesis",
        prompt: "In the presence of solar UV radiation, epidermal keratinocytes convert a cholesterol derivative into cholecalciferol, the precursor to:",
        options: ["Vitamin D (Calcitriol)", "Melatonin", "Keratin", "Vitamin A"],
        correct: 0,
        explanation: "Keratinocytes use UV radiation to convert 7-dehydrocholesterol to cholecalciferol (vitamin D3), which is enzymatically modified by the liver and kidneys into active calcitriol."
      },
      {
        id: 15, chapter: 5, chapName: "Ch 5: Keratinization",
        prompt: "In which epidermal layer do keratinocytes undergo apoptosis, accumulate keratohyalin granules, and release lamellar bodies rich in glycolipids to water-proof the skin?",
        options: ["Stratum granulosum", "Stratum basale", "Stratum spinosum", "Stratum lucidum"],
        correct: 0,
        explanation: "In the stratum granulosum, cells begin dying, nuclei disintegrate, keratohyalin matures, and glycolipid secretion seals intercellular spaces to prevent fluid loss."
      },
      {
        id: 16, chapter: 5, chapName: "Ch 5: Clinical Burns",
        prompt: "A burn injury that damages the entire epidermis and upper portions of the dermis, characterized by pain, localized erythema, and blister formation, is a:",
        options: ["Second-degree (partial-thickness) burn", "First-degree burn", "Third-degree (full-thickness) burn", "Fourth-degree burn"],
        correct: 0,
        explanation: "Second-degree burns penetrate into the dermis, causing tissue fluid accumulation between the epidermal and dermal layers that manifests clinically as blisters."
      },
      {
        id: 17, chapter: 5, chapName: "Ch 5: Skin Cancers",
        prompt: "The most lethal form of skin cancer, arising from the uncontrolled proliferation of pigment-producing cells and characterized by the ABCDE criteria, is:",
        options: ["Melanoma", "Basal cell carcinoma", "Squamous cell carcinoma", "Kaposi sarcoma"],
        correct: 0,
        explanation: "Melanoma originates in melanocytes. It is highly invasive and metastatic, identified clinically by Asymmetry, Border irregularity, Color variation, Diameter >6mm, and Evolving shape."
      },
      {
        id: 18, chapter: 5, chapName: "Ch 5: Cutaneous Cleavage",
        prompt: "Predominant directional orientations of collagen fiber bundles within the reticular dermis that surgeons follow to minimize post-operative scarring are called:",
        options: ["Cleavage lines (Langer lines)", "Friction ridges", "Flexure lines", "Dermal papillae"],
        correct: 0,
        explanation: "Cleavage (Langer's) lines reflect natural tension vectors of collagen bundles in the reticular dermis. Incisions parallel to these lines heal with minimal scar tissue."
      },
      {
        id: 19, chapter: 5, chapName: "Ch 5: Nail Anatomy",
        prompt: "The actively growing thickened proximal segment of the nail bed responsible for producing the nail plate is the:",
        options: ["Nail matrix", "Hyponychium", "Eponychium (cuticle)", "Lunula"],
        correct: 0,
        explanation: "The nail matrix is the deep proliferating zone of epithelial stem cells at the nail root that divides and keratinizes to push the hardened nail plate forward."
      },
      {
        id: 20, chapter: 5, chapName: "Ch 5: Nail Anatomy",
        prompt: "The narrow fold of epidermis extending onto the proximal border of the nail plate, commonly known as the cuticle, is the:",
        options: ["Eponychium", "Hyponychium", "Perionychium", "Lunula"],
        correct: 0,
        explanation: "The eponychium (cuticle) is the mucosal stratum corneum fold sealing the proximal junction between the dorsal digit skin and the emerging nail plate."
      },
      {
        id: 21, chapter: 5, chapName: "Ch 5: Thermoregulation",
        prompt: "When ambient body temperature rises, how do dermal blood vessels respond to dissipate heat through the skin surface?",
        options: ["Vasodilation (arterioles dilate)", "Vasoconstriction", "Thrombosis", "Shunting blood exclusively to internal viscera"],
        correct: 0,
        explanation: "Dermal arterioles dilate (vasodilation), dramatically increasing blood flow through subpapillary plexuses so excess heat radiates away through the skin surface."
      },
      {
        id: 22, chapter: 5, chapName: "Ch 5: Epidermal Histology",
        prompt: "Which structural junction tightly anchors adjacent keratinocytes together in the stratum spinosum, giving cells their spiny microscopic appearance?",
        options: ["Desmosomes", "Gap junctions", "Tight junctions", "Hemidesmosomes"],
        correct: 0,
        explanation: "Desmosomes are intermediate filament-reinforced spot welds holding shrinking keratinocytes together, creating artifactual spiny spines in histological preparation."
      },
      {
        id: 23, chapter: 5, chapName: "Ch 5: Modified Glands",
        prompt: "Specialized modified apocrine exocrine glands in the external auditory canal that secrete cerumen (earwax) are classified as:",
        options: ["Ceruminous glands", "Mammary glands", "Sebaceous glands", "Eccrine glands"],
        correct: 0,
        explanation: "Ceruminous glands are modified apocrine coils in the ear canal that secrete a waxy component combining with sebaceous lipids to form protective earwax (cerumen)."
      },
      {
        id: 24, chapter: 5, chapName: "Ch 5: Epidermal Renewal",
        prompt: "The outermost epidermal layer consisting of 20 to 30 layers of dead, anucleated, flattened keratinized scales that continuously desquamate is the:",
        options: ["Stratum corneum", "Stratum granulosum", "Stratum spinosum", "Stratum lucidum"],
        correct: 0,
        explanation: "The stratum corneum is the tough, keratin-packed superficial protective barrier that constantly sloughs away dead squames through normal desquamation."
      },
      {
        id: 25, chapter: 5, chapName: "Ch 5: Clinical Conditions",
        prompt: "An autoimmune inflammatory condition characterized by accelerated keratinocyte turnover, resulting in silvery, scaly plaques on erythematous skin, is:",
        options: ["Psoriasis", "Eczema (dermatitis)", "Basal cell carcinoma", "Alopecia areata"],
        correct: 0,
        explanation: "Psoriasis is an autoimmune disorder where excessive T-cell signaling drives rapid epidermal mitosis, causing immature keratinocytes to pile up in scaly plaques."
      },

      /* =========================================================
         CHAPTER 6: THE SKELETAL SYSTEM & BONE TISSUE (26 - 50)
         ========================================================= */
      {
        id: 26, chapter: 6, chapName: "Ch 6: Bone Cells",
        prompt: "Giant, multinucleated bone-resorbing cells derived from hematopoietic monocyte/macrophage lineages that secrete acid and enzymes to break down bone matrix are:",
        options: ["Osteoclasts", "Osteoblasts", "Osteocytes", "Osteogenic cells"],
        correct: 0,
        explanation: "Osteoclasts are specialized multinucleated phagocytic cells that seal against bone and secrete hydrochloric acid and collagenases to resorb mineralized matrix."
      },
      {
        id: 27, chapter: 6, chapName: "Ch 6: Bone Cells",
        prompt: "Cuboidal bone-forming cells that actively synthesize, secrete, and deposit unmineralized organic bone matrix (osteoid) are:",
        options: ["Osteoblasts", "Osteoclasts", "Osteocytes", "Chondrocytes"],
        correct: 0,
        explanation: "Osteoblasts are bone-building cells that manufacture collagen fibers and proteoglycans (osteoid) and initiate calcium phosphate crystallization."
      },
      {
        id: 28, chapter: 6, chapName: "Ch 6: Bone Cells",
        prompt: "Mature bone cells that reside inside tiny lacunae and maintain bone matrix homeostasis by detecting mechanical strain are called:",
        options: ["Osteocytes", "Osteoclasts", "Osteoprogenitor cells", "Fibroblasts"],
        correct: 0,
        explanation: "Osteocytes are former osteoblasts entrapped in calcified lacunae; they act as mechanical stress sensors that coordinate bone remodeling through canaliculi networks."
      },
      {
        id: 29, chapter: 6, chapName: "Ch 6: Bone Cells",
        prompt: "Mesenchymal stem cells located in the periosteum, endosteum, and central canals that undergo mitosis to produce osteoblasts are:",
        options: ["Osteogenic (osteoprogenitor) cells", "Osteocytes", "Osteoclasts", "Chondroblasts"],
        correct: 0,
        explanation: "Osteogenic cells are unspecialized stem cells capable of cell division; their daughter cells differentiate directly into matrix-producing osteoblasts."
      },
      {
        id: 30, chapter: 6, chapName: "Ch 6: Compact Bone Histology",
        prompt: "The structural and functional microscopic repeating cylindrical unit of compact bone tissue is termed the:",
        options: ["Osteon (Haversian system)", "Trabecula", "Canaliculus", "Lacuna"],
        correct: 0,
        explanation: "An osteon (Haversian system) is the fundamental cylindrical structural unit of compact bone, consisting of concentric lamellae surrounding a neurovascular canal."
      },
      {
        id: 31, chapter: 6, chapName: "Ch 6: Compact Bone Histology",
        prompt: "The central longitudinal channel within an osteon carrying neurovascular structures (blood vessels and nerves) along the bone axis is the:",
        options: ["Central (Haversian) canal", "Perforating (Volkmann) canal", "Canaliculus", "Medullary cavity"],
        correct: 0,
        explanation: "The central (Haversian) canal runs down the center of each osteon, containing arterial branches, venules, lymphatics, and nerves supplying resident osteocytes."

    /* PERSISTENT MASTERY ENGINE (localStorage) */
    const STORAGE_KEY = "ap1_unit2_progressive_mastery";

    function getMasteredIDs() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    function saveMasteredID(id) {
      let mastered = getMasteredIDs();
      const hadUnlockedBefore = isBoneUnlocked(mastered);

      if (!mastered.includes(id)) {
        mastered.push(id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(mastered));
      }

      const nowUnlocked = isBoneUnlocked(mastered);
      if (!hadUnlockedBefore && nowUnlocked) {
        triggerScienceConfetti();
        alert("🎉 Congratulations! You have mastered 80% of the Integumentary System! The Skeletal System (Bone Biology) is now unlocked!");
      }

      updateDashboard();
    }

    function isBoneUnlocked(masteredList) {
      const skinMasteredCount = masteredList.filter(id => id <= 25).length;
      return skinMasteredCount >= UNLOCK_THRESHOLD;
    }

    function clearSavedMastery() {
      if (confirm("Reset all mastered question history for Unit 2?")) {
        localStorage.removeItem(STORAGE_KEY);
        updateDashboard();
        startNewAttempt();
      }
    }

    function updateDashboard() {
      const mastered = getMasteredIDs();
      const total = QUESTION_BANK.length;
      const count = mastered.length;
      const pct = Math.round((count / total) * 100);

      const skinMastered = mastered.filter(id => id <= 25).length;
      const boneMastered = mastered.filter(id => id > 25).length;
      const unlocked = isBoneUnlocked(mastered);

      document.getElementById("masteredCount").textContent = `${count} / ${total}`;
      document.getElementById("masteryPct").textContent = `${pct}%`;
      document.getElementById("questionsLeft").textContent = total - count;
      document.getElementById("masteryBar").style.width = `${pct}%`;

      document.getElementById("skinMasteredCount").textContent = `${skinMastered} / 25`;

      const banner = document.getElementById("tierBanner");
      const statusText = document.getElementById("tierStatusText");
      const counterText = document.getElementById("tierCounterText");
      const boneDisplay = document.getElementById("boneMasteredCount");

      if (!unlocked) {
        banner.className = "tier-banner locked";
        statusText.innerHTML = `🔒 <strong>Stage 1: Integumentary System</strong> (Master 20/25 skin questions to unlock Bone Biology)`;
        counterText.textContent = `${skinMastered} / ${UNLOCK_THRESHOLD}`;
        boneDisplay.textContent = "🔒 Locked";
        boneDisplay.style.color = "#94a3b8";
        document.getElementById("topicsCovered").textContent = "1 / 2";
      } else {
        banner.className = "tier-banner unlocked";
        statusText.innerHTML = `🔓 <strong>Stage 2: Comprehensive Mode</strong> (Both Integumentary & Skeletal Systems Active)`;
        counterText.textContent = "UNLOCKED";
        boneDisplay.textContent = `${boneMastered} / 25`;
        boneDisplay.style.color = "#38bdf8";
        document.getElementById("topicsCovered").textContent = "2 / 2";
      }
    }

    /* CURRENT ATTEMPT LOGIC */
    let currentQuestions = [];
    let currentAnswers = {};
    let currentCorrectCount = 0;

    function sampleQuizQuestions() {
      const mastered = getMasteredIDs();
      const unlocked = isBoneUnlocked(mastered);
      let picked = [];

      if (!unlocked) {
        // Only sample from Chapter 5 (Integumentary: IDs 1-25)
        let skinQuestions = QUESTION_BANK.filter(q => q.chapter === 5);
        let unmasteredSkin = skinQuestions.filter(q => !mastered.includes(q.id));

        unmasteredSkin.sort(() => Math.random() - 0.5);
        skinQuestions.sort(() => Math.random() - 0.5);

        if (unmasteredSkin.length >= 10) {
          picked = unmasteredSkin.slice(0, 10);
        } else {
          picked = unmasteredSkin.concat(skinQuestions.filter(q => !unmasteredSkin.includes(q))).slice(0, 10);
        }
      } else {
        // Sample balanced 5 from Chapter 5 and 5 from Chapter 6
        [5, 6].forEach(ch => {
          let chQuestions = QUESTION_BANK.filter(q => q.chapter === ch);
          let unmastered = chQuestions.filter(q => !mastered.includes(q.id));

          unmastered.sort(() => Math.random() - 0.5);
          chQuestions.sort(() => Math.random() - 0.5);

          let take = [];
          if (unmastered.length >= 5) {
            take = unmastered.slice(0, 5);
          } else {
            take = unmastered.concat(chQuestions.filter(q => !unmastered.includes(q))).slice(0, 5);
          }
          picked = picked.concat(take);
        });
      }

      return picked.sort(() => Math.random() - 0.5);
    }

    function startNewAttempt() {
      currentQuestions = sampleQuizQuestions();
      currentAnswers = {};
      currentCorrectCount = 0;

      updateDashboard();
      updateAttemptStats();
      renderActiveQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderActiveQuiz() {
      const container = document.getElementById("quizContainer");
      container.innerHTML = "";

      currentQuestions.forEach((q, qIndex) => {
        const card = document.createElement("div");
        card.className = "q-card";
        card.id = `qCard_${q.id}`;

        const indices = [0, 1, 2, 3].sort(() => Math.random() - 0.5);

        let optionsHtml = "";
        indices.forEach(optIndex => {
          optionsHtml += `
            <div class="opt-btn" id="opt_${q.id}_${optIndex}" onclick="submitAnswer(${q.id}, ${optIndex})">
              <div class="radio-circle"></div>
              <div>${q.options[optIndex]}</div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="q-header">
            <span>Question ${qIndex + 1} • <strong style="color:#38bdf8;">${q.chapName}</strong></span>
            <span>1 pt</span>
          </div>
          <div class="q-body">
            <div class="q-prompt">${q.prompt}</div>
            <div class="options-list">
              ${optionsHtml}
            </div>
            <div class="feedback-box" id="feedback_${q.id}"></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function submitAnswer(qId, chosenIdx) {
      if (currentAnswers[qId] !== undefined) return;
      currentAnswers[qId] = chosenIdx;

      const q = currentQuestions.find(item => item.id === qId);
      const isCorrect = (chosenIdx === q.correct);

      [0, 1, 2, 3].forEach(idx => {
        const btn = document.getElementById(`opt_${qId}_${idx}`);
        if (btn) {
          btn.classList.add("locked");
          if (idx === q.correct) {
            btn.classList.add("correct-choice");
          } else if (idx === chosenIdx) {
            btn.classList.add("wrong-choice");
          }
        }
      });

      const fb = document.getElementById(`feedback_${qId}`);
      if (isCorrect) {
        currentCorrectCount++;
        saveMasteredID(q.id);
        fb.className = "feedback-box correct";
        fb.innerHTML = `<strong>✓ Correct!</strong> ${q.explanation}`;
        triggerScienceConfetti();
      } else {
        fb.className = "feedback-box incorrect";
        fb.innerHTML = `<strong>✗ Incorrect.</strong> ${q.explanation}`;
      }

      updateAttemptStats();
    }

    function updateAttemptStats() {
      const answered = Object.keys(currentAnswers).length;
      document.getElementById("attemptProgress").textContent = `${answered} / ${currentQuestions.length}`;
      const pct = answered === 0 ? 0 : Math.round((currentCorrectCount / answered) * 100);
      document.getElementById("attemptScore").textContent = `${pct}%`;
    }

    /* ANIMATED SCIENCE CONFETTI */
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let animationFrame = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function triggerScienceConfetti() {
      const count = 45;
      const colors = ["#38bdf8", "#4ade80", "#facc15", "#fb923c", "#c084fc", "#22d3ee"];
      const shapes = ["dna", "atom", "ring", "star", "circle"];

      for (let i = 0; i < count; i++) {
        particles.push({
          x: window.innerWidth / 2 + (Math.random() * 200 - 100),
          y: window.innerHeight * 0.35 + (Math.random() * 100 - 50),
          vx: (Math.random() - 0.5) * 14,
          vy: Math.random() * -12 - 4,
          size: Math.random() * 12 + 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          shape: shapes[Math.floor(Math.random() * shapes.length)],
          rotation: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.2,
          alpha: 1
        });
      }

      if (!animationFrame) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.rotation += p.vr;
        p.alpha -= 0.012;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.strokeStyle = p.color;
        ctx.fillStyle = p.color;
        ctx.lineWidth = 2;

        if (p.shape === "circle") {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 3, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.shape === "ring") {
          ctx.beginPath();
          for (let s = 0; s < 6; s++) {
            const angle = (s * Math.PI) / 3;
            const hx = Math.cos(angle) * (p.size / 2);
            const hy = Math.sin(angle) * (p.size / 2);
            if (s === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          ctx.stroke();
        } else if (p.shape === "atom") {
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size / 2, p.size / 5, Math.PI / 4, 0, Math.PI * 2);
          ctx.ellipse(0, 0, p.size / 2, p.size / 5, -Math.PI / 4, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.shape === "dna") {
          ctx.beginPath();
          ctx.moveTo(-p.size / 2, -p.size / 3);
          ctx.lineTo(p.size / 2, -p.size / 3);
          ctx.moveTo(-p.size / 2, p.size / 3);
          ctx.lineTo(p.size / 2, p.size / 3);
          ctx.moveTo(0, -p.size / 3);
          ctx.lineTo(0, p.size / 3);
          ctx.stroke();
        } else if (p.shape === "star") {
          ctx.fillRect(-p.size / 4, -p.size / 4, p.size / 2, p.size / 2);
        }

        ctx.restore();

        if (p.alpha <= 0 || p.y > canvas.height) {
          particles.splice(i, 1);
        }
      }

      if (particles.length > 0) {
        animationFrame = requestAnimationFrame(animateConfetti);
      } else {
        animationFrame = null;
      }
    }

    window.onload = startNewAttempt;
  </script>
